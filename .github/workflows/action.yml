name: Action

# The actions are the half of this repository no unit test reaches: they build
# fastchess, fetch a book, set environment files and read job outputs, and none
# of those are true off a runner. This runs them against a book table of one
# book and checks what a consumer depends on.
#
# play-shard is here too, playing a real engine. The engine is stash, built
# through the fixture opponent table at a pinned tag, playing itself: what is
# under test is the plumbing around the games and not who wins them.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # naming the shell is what turns on pipefail
        shell: bash
    steps:
      # The checkout leaves the token it used in .git/config unless it is told
      # not to. This workflow only reads the tree, so nothing wants it there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Out of the checkout, which is how a consumer's job reaches it and where
      # the book table below comes from. zizmor prefers the `$/` form, which
      # gets the action without a checkout; that is not the shape being tested.
      - uses: ./actions/setup # zizmor: ignore[self-repository]
        id: tools
        with:
          book_table: tests/fixtures/books.sh

      - name: The harness is there and runs
        run: |
          tools/fastchess --version

      - name: The book is the one the table names
        run: |
          tests/fixtures/books.sh verify 8moves_v3 tools

      - name: The package is on the path the action set
        run: |
          python3 -m mache.match_estimate --help > /dev/null
          python3 -m mache.rating_estimate --help > /dev/null
          python3 -m mache.match_terminations --help > /dev/null
          python3 -m mache.book_slice --help > /dev/null

      - name: The version output is the package's own
        env:
          REPORTED: ${{ steps.tools.outputs.version }}
          FASTCHESS: ${{ steps.tools.outputs.fastchess }}
        run: |
          installed=$(python3 -c 'import mache; print(mache.__version__)')
          if [ "$REPORTED" != "$installed" ]; then
            echo "::error::the action says ${REPORTED} and the package says ${installed}"
            exit 1
          fi
          echo "mache ${REPORTED} with fastchess ${FASTCHESS}"

  estimator-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No book table is given, because this mode must not read one. A job that
      # reads games rather than playing them wants the package and nothing else.
      - uses: ./actions/setup # zizmor: ignore[self-repository]
        id: tools
        with:
          estimator_only: true

      - name: Nothing was built and nothing was fetched
        run: |
          if [ -e tools ]; then
            echo "::error::tools/ exists, so the build or the books ran"
            ls -l tools
            exit 1
          fi

      - name: The package still imports and still says what it is
        env:
          REPORTED: ${{ steps.tools.outputs.version }}
        run: |
          python3 -c 'from mache import match_estimate, rating_estimate'
          test "$REPORTED" = "$(python3 -c 'import mache; print(mache.__version__)')"

  orchestration:
    # The actions a caller runs before anything is built. Each is checked
    # through its outputs, because outputs are the part a workflow author
    # writes against and the part a unit test on the scripts cannot see.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # resolve-ref looks through the tags, and a shallow clone has none
          fetch-depth: 0

      - uses: ./actions/setup # zizmor: ignore[self-repository]
        with:
          estimator_only: true

      - name: The shell tools the setup action put on the path are runnable
        run: |
          command -v resolve_ref.sh

      - uses: ./actions/resolve-ref # zizmor: ignore[self-repository]
        id: head
        with:
          ref: ""
          when_empty: head

      - uses: ./actions/plan-shards # zizmor: ignore[self-repository]
        id: shards
        with:
          games: 500
          shards: 4
          book: 8moves_v3
          book_table: tests/fixtures/books.sh
          max_match_minutes: 150

      - uses: ./actions/plan-ladder # zizmor: ignore[self-repository]
        id: ladder
        with:
          games: 50
          ladder: stash:v1:2500,stash:v2:2600
          opponent_table: tests/fixtures/opponents.sh
          book: 8moves_v3
          book_table: tests/fixtures/books.sh
          max_match_minutes: 150

      - name: The outputs are what a caller would write against
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          PAIRS: ${{ steps.shards.outputs.pairs }}
          SHARD_LIST: ${{ steps.shards.outputs.shards }}
          SHARD_TIMEOUT: ${{ steps.shards.outputs.play_timeout }}
          BOOK: ${{ steps.shards.outputs.book }}
          RUNGS: ${{ steps.ladder.outputs.rungs }}
          SPEC: ${{ steps.ladder.outputs.spec }}
        run: |
          test "$HEAD_SHA" = "$GITHUB_SHA"
          test "$PAIRS" = "62"
          test "$SHARD_LIST" = "[0,1,2,3]"
          test "$SHARD_TIMEOUT" = "180"
          test "$BOOK" = "8moves_v3"
          test "$SPEC" = "stash-v1:2500,stash-v2:2600"
          echo "$RUNGS"

  play:
    # The one test here that starts fastchess. Everything else about
    # play-shard is checked by unit tests on its scripts, and none of them can
    # see a composite action's outputs, its environment lines or a pgn.
    #
    # The engine plays itself, so the result is noise and is not looked at.
    # What is looked at is the schedule, which is predicted rather than read
    # back: at seed 7 over 34,700 openings, one shard of two pairs starts at
    # opening 8, and mache/book_slice.py is what says so.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/setup # zizmor: ignore[self-repository]
        id: tools
        with:
          book_table: tests/fixtures/books.sh

      # Through the table rather than by hand, so the `build` verb of the
      # opponent contract is exercised by something. stash is a plain make and
      # takes about a second; the same binary plays both sides, because
      # building it twice would prove nothing the first build did not.
      - name: Build the engine both sides play
        run: |
          tests/fixtures/opponents.sh build stash v17.0 tools/new
          cp tools/new tools/old

      - uses: ./actions/play-shard # zizmor: ignore[self-repository]
        id: play
        with:
          candidate: new
          candidate_binary: ./new
          opponent: old
          opponent_binary: ./old
          book: 8moves_v3
          book_table: tests/fixtures/books.sh
          pairs: 2
          shards: 1
          shard: 0
          seed: 7
          time_control: 1+0.01
          max_match_minutes: 5

      - name: The shard played the schedule it was told to
        env:
          OPENINGS: ${{ steps.play.outputs.openings }}
          START: ${{ steps.play.outputs.start }}
          STOPPED_BY: ${{ steps.play.outputs.stopped_by }}
          BOOK_FILE: ${{ steps.play.outputs.book_file }}
        run: |
          test "$BOOK_FILE" = "8moves_v3.pgn"
          # counted from the file rather than written down anywhere
          test "$OPENINGS" = "34700"
          test "$START" = "8"
          case "$STOPPED_BY" in
            "fastchess, at the game count") ;;
            *) echo "::error::the shard stopped by ${STOPPED_BY}"; exit 1 ;;
          esac

      - name: The games came back, and the environment carries them
        env:
          # written by the action to the calling job's environment, which is
          # what a caller's manifest step reads with `if: always()`
          ENV_START: ${{ env.START }}
          ENV_STOPPED_BY: ${{ env.STOPPED_BY }}
        run: |
          played=$(grep -c '^\[Event ' tools/games.pgn)
          if [ "$played" != "4" ]; then
            echo "::error::two pairs is four games, and ${played} came back"
            exit 1
          fi
          test -s tools/result.txt
          # the same two facts the outputs carry, by the other route
          test "$ENV_START" = "8"
          test "$ENV_STOPPED_BY" = "fastchess, at the game count"

      - name: The summary reads them
        run: |
          mkdir -p shards/shard-0
          cp tools/games.pgn shards/shard-0/

      - uses: ./actions/summarise-match # zizmor: ignore[self-repository]
        id: summary
        with:
          games: shards
          candidate: new
          candidate_sha: 0000000000000000000000000000000000000000
          baseline: old
          baseline_sha: 1111111111111111111111111111111111111111
          shards: 1
          time_control: 1+0.01

      - name: The summary said something about the games it read
        env:
          LINE: ${{ steps.summary.outputs.line }}
        run: |
          case "$LINE" in
            "Performance compared to old | "*"(4 games)") ;;
            *) echo "::error::the summary line reads ${LINE}"; exit 1 ;;
          esac
          # The version that read the games, which is what lets a figure be
          # read back against the tooling that produced it. Read out of the
          # report rather than out of GITHUB_STEP_SUMMARY: that variable names
          # a different file in every step, so a later step grepping it reads
          # an empty one and would pass whatever the summary said.
          grep -q "Read by mache" report.md
