name: Release

# A release is a tag. The tag has to agree with the version in the package, or
# an install would report a version nobody released, so that is checked before
# anything is built and the rest of the run depends on it.

on:
  push:
    tags: [ "v*" ]
  # Run against a tag from the actions tab, either to redo a release or
  # because tag-release.yml started it: a tag a workflow pushed itself does
  # not set off the trigger above.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The checkout leaves the token it used in .git/config unless it is told
      # not to. No job here pushes with git, so no job wants it there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: The tag is the version the package states
        env:
          TAG: ${{ github.ref_name }}
        run: |
          stated=$(python3 -c 'import mache; print(mache.__version__)')
          if [ "$TAG" != "v${stated}" ]; then
            echo "::error::the tag is ${TAG} and the package says ${stated}"
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: |
          # build and twine together, from the one pinned file, because the
          # check below runs in this same job
          python -m pip install --quiet --require-hashes -r .github/requirements/release.txt
          python -m build

      - name: Check what was built
        run: |
          python -m twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The publish happens by trusted publishing, so the only credential is the
    # token GitHub mints for this job and no secret is stored here. The PyPI
    # project's publisher configuration names this repository, this workflow
    # file and this environment, so a job anywhere else cannot upload under the
    # name even with the same code.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The tag's own message is the release notes, so what the release says
          # is what the tag says and there is one place to write it. The fetch
          # is anonymous, which is why the checkout above can drop its
          # credential: the repository is public, and gh reads GH_TOKEN rather
          # than anything git left behind.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md
