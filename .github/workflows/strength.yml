name: Strength

# A whole sharded strength match, as one call. A caller that wants the job
# graph, its own cache action and its own manifest calls the six actions
# instead and writes about two hundred lines; this is for everyone else, and
# costs about twenty.
#
# What a reusable workflow cannot do is take a step. `uses:` is not an
# expression, so no caller can hand this one its own cache action or its own
# build. Both arrive as data instead: the build as a path to a program in the
# caller's repository, and the cache as the paths and the key a generic
# actions/cache wants. That is the price of this shape and it is why the
# actions exist beside it.

on:
  workflow_call:
    inputs:
      build:
        description: >
          A program in the calling repository that builds the engine at a
          commit. Called as `<build> <ref> <binary>` and expected to leave a
          runnable engine at `<binary>`. See the contract in
          .github/workflows/README.md.
        type: string
        required: true
      candidate:
        description: What to test. A branch, tag, commit or pull request number. The ref the call runs on by default.
        type: string
        default: ""
      baseline:
        description: What to measure it against. The last full release by default.
        type: string
        default: ""
      release_glob:
        description: The tag pattern that default baseline looks through.
        type: string
        default: v[0-9]*
      games:
        description: Games to play in total, split between the shards.
        type: number
        default: 500
      shards:
        description: Jobs to split them across.
        type: number
        default: 5
      time_control:
        description: Passed to fastchess as tc.
        type: string
        default: 10+0.1
      book:
        description: The opening set, one the book table knows.
        type: string
        default: 8moves_v3
      book_table:
        description: The book table in the calling repository.
        type: string
        default: scripts/book.sh
      sprt:
        description: Judge a sequential test over the pooled pairs rather than reporting a difference.
        type: boolean
        default: false
      elo0:
        description: The null the test is against.
        type: number
        default: 0
      elo1:
        description: The alternative the test is against.
        type: number
        default: 10
      prior_pairs:
        description: The pair counts of the batches already played. Empty for the first.
        type: string
        default: ""
      batches:
        description: >
          How many batches the sequential test may play before it reports
          inconclusive and stops. `games` is the size of one batch either way,
          so the whole test is capped at `games` times this. One is what a
          caller played before batches existed, and plays the same games.
          Four is as deep as the ladder below is written; asking for more is
          refused rather than quietly truncated.
        type: number
        default: 1
      seed:
        description: Picks the region of the book each shard plays. The run id by default, and the manifest records it either way.
        type: string
        default: ""
      cache_paths:
        description: >
          What to hand actions/cache between runs, one path a line. Empty
          caches nothing, which is correct and slower. A caller wanting a
          toolchain-aware cache action calls the six actions instead: `uses:`
          cannot be an expression, so no reusable workflow can take one.
        type: string
        default: ""
      cache_key:
        description: The key those paths are cached under. Required when cache_paths is set.
        type: string
        default: ""
      manifest_extra:
        description: >
          Lines the caller wants in every shard's manifest, such as what built
          the engine. Written after the lines this workflow knows.
        type: string
        default: ""
      hash_mb:
        description: The table each side is asked for.
        type: number
        default: 256
      concurrency:
        description: Games a shard plays at once.
        type: number
        default: 2
      max_match_minutes:
        description: The wall clock cap on play alone. The job timeout is this plus half an hour.
        type: number
        default: 150
      startup_ms:
        description: How long fastchess waits for an engine to answer uci.
        type: number
        default: 20000
      artifact_prefix:
        description: What the per-shard artifacts are named. The run and the attempt are added.
        type: string
        default: strength
      retention_days:
        description: How long the games are kept. Ninety is the maximum a public repository allows.
        type: number
        default: 90
    outputs:
      line:
        description: >
          The one line a release note carries, from the last batch that
          played. Empty when there was nothing to compare against.
        value: ${{ jobs.batch4.outputs.line || jobs.batch3.outputs.line || jobs.batch2.outputs.line || jobs.batch1.outputs.line }}
      verdict:
        description: >
          What the sequential test came to over every pair it played: passed,
          failed, or inconclusive where the last batch of the ladder settled
          nothing. Empty when the run was not a sequential test.
        value: ${{ jobs.batch4.outputs.verdict || jobs.batch3.outputs.verdict || jobs.batch2.outputs.verdict || jobs.batch1.outputs.verdict }}
      carried:
        description: >
          The pair counts of the whole test, for a caller carrying it on in
          another run. That is what an inconclusive verdict is handed back for.
        value: ${{ jobs.batch4.outputs.carried || jobs.batch3.outputs.carried || jobs.batch2.outputs.carried || jobs.batch1.outputs.carried }}
      baseline_sha:
        description: The commit the baseline resolved to. Empty means the match was skipped.
        value: ${{ jobs.resolve.outputs.baseline_sha }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      baseline_name: ${{ steps.baseline.outputs.name }}
      baseline_sha: ${{ steps.baseline.outputs.sha }}
      candidate_name: ${{ steps.candidate.outputs.name }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      pairs: ${{ steps.plan.outputs.pairs }}
      book: ${{ steps.plan.outputs.book }}
      play_timeout: ${{ steps.plan.outputs.play_timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tags are what the default baseline looks through
          fetch-depth: 0
          persist-credentials: false

      # before a runner builds anything, and here rather than in plan-shards
      # because it is this file's ladder that sets the ceiling, not the plan
      - name: Check the test fits the ladder
        env:
          BATCHES: ${{ inputs.batches }}
        run: |
          [ "$BATCHES" -ge 1 ] && [ "$BATCHES" -le 4 ] || {
            echo "::error::batches is 1 to 4, the stages this workflow has, and was ${BATCHES}. A longer test is carried on by a second run, with prior_pairs"
            exit 1
          }

      - uses: aywrite/mache/actions/resolve-ref@v0.4.0
        id: candidate
        with:
          ref: ${{ inputs.candidate }}
          label: candidate
          when_empty: head

      - uses: aywrite/mache/actions/resolve-ref@v0.4.0
        id: baseline
        with:
          ref: ${{ inputs.baseline }}
          label: baseline
          when_empty: last-release
          release_glob: ${{ inputs.release_glob }}

      - name: Say so when there is nothing to compare against
        if: steps.baseline.outputs.sha == ''
        run: echo "::notice::No previous release to compare against, skipping"

      - uses: aywrite/mache/actions/plan-shards@v0.4.0
        id: plan
        with:
          games: ${{ inputs.games }}
          shards: ${{ inputs.shards }}
          sprt: ${{ inputs.sprt }}
          elo0: ${{ inputs.elo0 }}
          elo1: ${{ inputs.elo1 }}
          prior_pairs: ${{ inputs.prior_pairs }}
          book: ${{ inputs.book }}
          book_table: ${{ inputs.book_table }}
          max_match_minutes: ${{ inputs.max_match_minutes }}

  # The batch ladder. Actions has no loop and `uses:` is not an expression, so
  # the stages are written out, and the count above is how deep this file goes.
  # Each waits on the one before and plays only where it settled nothing, which
  # is the early stop: a decided test stops playing. They share a seed, and
  # batch.yml's reservation is what keeps them off each other's openings.
  #
  # A run that is not a sequential test has no verdict to be inconclusive, so
  # it stops after the first stage whatever `batches` says.
  batch1:
    needs: resolve
    if: needs.resolve.outputs.baseline_sha != ''
    # relative, so the batch definition is this file's own rather than
    # a tag of it. A caller pinning a release of this workflow gets the
    # batch.yml of that same release, which a pin could not have given on
    # the release that first carried one
    uses: ./.github/workflows/batch.yml
    with:
      batch: 0
      batches: ${{ inputs.batches }}
      prior_pairs: ${{ inputs.prior_pairs }}
      build: ${{ inputs.build }}
      candidate_name: ${{ needs.resolve.outputs.candidate_name }}
      candidate_sha: ${{ needs.resolve.outputs.candidate_sha }}
      baseline_name: ${{ needs.resolve.outputs.baseline_name }}
      baseline_sha: ${{ needs.resolve.outputs.baseline_sha }}
      shards: ${{ needs.resolve.outputs.shards }}
      count: ${{ needs.resolve.outputs.count }}
      pairs: ${{ needs.resolve.outputs.pairs }}
      play_timeout: ${{ fromJSON(needs.resolve.outputs.play_timeout) }}
      book: ${{ needs.resolve.outputs.book }}
      book_table: ${{ inputs.book_table }}
      seed: ${{ inputs.seed || github.run_id }}
      time_control: ${{ inputs.time_control }}
      sprt: ${{ inputs.sprt }}
      elo0: ${{ inputs.elo0 }}
      elo1: ${{ inputs.elo1 }}
      cache_paths: ${{ inputs.cache_paths }}
      cache_key: ${{ inputs.cache_key }}
      manifest_extra: ${{ inputs.manifest_extra }}
      hash_mb: ${{ inputs.hash_mb }}
      concurrency: ${{ inputs.concurrency }}
      max_match_minutes: ${{ inputs.max_match_minutes }}
      startup_ms: ${{ inputs.startup_ms }}
      artifact_prefix: ${{ inputs.artifact_prefix }}
      retention_days: ${{ inputs.retention_days }}

  batch2:
    needs: [resolve, batch1]
    if: needs.batch1.outputs.verdict == 'inconclusive'
    # relative, so the batch definition is this file's own rather than
    # a tag of it. A caller pinning a release of this workflow gets the
    # batch.yml of that same release, which a pin could not have given on
    # the release that first carried one
    uses: ./.github/workflows/batch.yml
    with:
      batch: 1
      batches: ${{ inputs.batches }}
      prior_pairs: ${{ needs.batch1.outputs.carried }}
      build: ${{ inputs.build }}
      candidate_name: ${{ needs.resolve.outputs.candidate_name }}
      candidate_sha: ${{ needs.resolve.outputs.candidate_sha }}
      baseline_name: ${{ needs.resolve.outputs.baseline_name }}
      baseline_sha: ${{ needs.resolve.outputs.baseline_sha }}
      shards: ${{ needs.resolve.outputs.shards }}
      count: ${{ needs.resolve.outputs.count }}
      pairs: ${{ needs.resolve.outputs.pairs }}
      play_timeout: ${{ fromJSON(needs.resolve.outputs.play_timeout) }}
      book: ${{ needs.resolve.outputs.book }}
      book_table: ${{ inputs.book_table }}
      seed: ${{ inputs.seed || github.run_id }}
      time_control: ${{ inputs.time_control }}
      sprt: ${{ inputs.sprt }}
      elo0: ${{ inputs.elo0 }}
      elo1: ${{ inputs.elo1 }}
      cache_paths: ${{ inputs.cache_paths }}
      cache_key: ${{ inputs.cache_key }}
      manifest_extra: ${{ inputs.manifest_extra }}
      hash_mb: ${{ inputs.hash_mb }}
      concurrency: ${{ inputs.concurrency }}
      max_match_minutes: ${{ inputs.max_match_minutes }}
      startup_ms: ${{ inputs.startup_ms }}
      artifact_prefix: ${{ inputs.artifact_prefix }}
      retention_days: ${{ inputs.retention_days }}

  batch3:
    needs: [resolve, batch2]
    if: needs.batch2.outputs.verdict == 'inconclusive'
    # relative, so the batch definition is this file's own rather than
    # a tag of it. A caller pinning a release of this workflow gets the
    # batch.yml of that same release, which a pin could not have given on
    # the release that first carried one
    uses: ./.github/workflows/batch.yml
    with:
      batch: 2
      batches: ${{ inputs.batches }}
      prior_pairs: ${{ needs.batch2.outputs.carried }}
      build: ${{ inputs.build }}
      candidate_name: ${{ needs.resolve.outputs.candidate_name }}
      candidate_sha: ${{ needs.resolve.outputs.candidate_sha }}
      baseline_name: ${{ needs.resolve.outputs.baseline_name }}
      baseline_sha: ${{ needs.resolve.outputs.baseline_sha }}
      shards: ${{ needs.resolve.outputs.shards }}
      count: ${{ needs.resolve.outputs.count }}
      pairs: ${{ needs.resolve.outputs.pairs }}
      play_timeout: ${{ fromJSON(needs.resolve.outputs.play_timeout) }}
      book: ${{ needs.resolve.outputs.book }}
      book_table: ${{ inputs.book_table }}
      seed: ${{ inputs.seed || github.run_id }}
      time_control: ${{ inputs.time_control }}
      sprt: ${{ inputs.sprt }}
      elo0: ${{ inputs.elo0 }}
      elo1: ${{ inputs.elo1 }}
      cache_paths: ${{ inputs.cache_paths }}
      cache_key: ${{ inputs.cache_key }}
      manifest_extra: ${{ inputs.manifest_extra }}
      hash_mb: ${{ inputs.hash_mb }}
      concurrency: ${{ inputs.concurrency }}
      max_match_minutes: ${{ inputs.max_match_minutes }}
      startup_ms: ${{ inputs.startup_ms }}
      artifact_prefix: ${{ inputs.artifact_prefix }}
      retention_days: ${{ inputs.retention_days }}

  batch4:
    needs: [resolve, batch3]
    if: needs.batch3.outputs.verdict == 'inconclusive'
    # relative, so the batch definition is this file's own rather than
    # a tag of it. A caller pinning a release of this workflow gets the
    # batch.yml of that same release, which a pin could not have given on
    # the release that first carried one
    uses: ./.github/workflows/batch.yml
    with:
      batch: 3
      batches: ${{ inputs.batches }}
      prior_pairs: ${{ needs.batch3.outputs.carried }}
      build: ${{ inputs.build }}
      candidate_name: ${{ needs.resolve.outputs.candidate_name }}
      candidate_sha: ${{ needs.resolve.outputs.candidate_sha }}
      baseline_name: ${{ needs.resolve.outputs.baseline_name }}
      baseline_sha: ${{ needs.resolve.outputs.baseline_sha }}
      shards: ${{ needs.resolve.outputs.shards }}
      count: ${{ needs.resolve.outputs.count }}
      pairs: ${{ needs.resolve.outputs.pairs }}
      play_timeout: ${{ fromJSON(needs.resolve.outputs.play_timeout) }}
      book: ${{ needs.resolve.outputs.book }}
      book_table: ${{ inputs.book_table }}
      seed: ${{ inputs.seed || github.run_id }}
      time_control: ${{ inputs.time_control }}
      sprt: ${{ inputs.sprt }}
      elo0: ${{ inputs.elo0 }}
      elo1: ${{ inputs.elo1 }}
      cache_paths: ${{ inputs.cache_paths }}
      cache_key: ${{ inputs.cache_key }}
      manifest_extra: ${{ inputs.manifest_extra }}
      hash_mb: ${{ inputs.hash_mb }}
      concurrency: ${{ inputs.concurrency }}
      max_match_minutes: ${{ inputs.max_match_minutes }}
      startup_ms: ${{ inputs.startup_ms }}
      artifact_prefix: ${{ inputs.artifact_prefix }}
      retention_days: ${{ inputs.retention_days }}
