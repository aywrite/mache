name: Strength

# A whole sharded strength match, as one call. A caller that wants the job
# graph, its own cache action and its own manifest calls the six actions
# instead and writes about two hundred lines; this is for everyone else, and
# costs about twenty.
#
# What a reusable workflow cannot do is take a step. `uses:` is not an
# expression, so no caller can hand this one its own cache action or its own
# build. Both arrive as data instead: the build as a path to a program in the
# caller's repository, and the cache as the paths and the key a generic
# actions/cache wants. That is the price of this shape and it is why the
# actions exist beside it.

on:
  workflow_call:
    inputs:
      build:
        description: >
          A program in the calling repository that builds the engine at a
          commit. Called as `<build> <ref> <binary>` and expected to leave a
          runnable engine at `<binary>`. See the contract in
          .github/workflows/README.md.
        type: string
        required: true
      candidate:
        description: What to test. A branch, tag, commit or pull request number. The ref the call runs on by default.
        type: string
        default: ""
      baseline:
        description: What to measure it against. The last full release by default.
        type: string
        default: ""
      release_glob:
        description: The tag pattern that default baseline looks through.
        type: string
        default: v[0-9]*
      games:
        description: Games to play in total, split between the shards.
        type: number
        default: 500
      shards:
        description: Jobs to split them across.
        type: number
        default: 5
      time_control:
        description: Passed to fastchess as tc.
        type: string
        default: 10+0.1
      book:
        description: The opening set, one the book table knows.
        type: string
        default: 8moves_v3
      book_table:
        description: The book table in the calling repository.
        type: string
        default: scripts/book.sh
      sprt:
        description: Judge a sequential test over the pooled pairs rather than reporting a difference.
        type: boolean
        default: false
      elo0:
        description: The null the test is against.
        type: number
        default: 0
      elo1:
        description: The alternative the test is against.
        type: number
        default: 10
      prior_pairs:
        description: The pair counts of the batches already played. Empty for the first.
        type: string
        default: ""
      seed:
        description: Picks the region of the book each shard plays. The run id by default, and the manifest records it either way.
        type: string
        default: ""
      cache_paths:
        description: >
          What to hand actions/cache between runs, one path a line. Empty
          caches nothing, which is correct and slower. A caller wanting a
          toolchain-aware cache action calls the six actions instead: `uses:`
          cannot be an expression, so no reusable workflow can take one.
        type: string
        default: ""
      cache_key:
        description: The key those paths are cached under. Required when cache_paths is set.
        type: string
        default: ""
      manifest_extra:
        description: >
          Lines the caller wants in every shard's manifest, such as what built
          the engine. Written after the lines this workflow knows.
        type: string
        default: ""
      hash_mb:
        description: The table each side is asked for.
        type: number
        default: 256
      concurrency:
        description: Games a shard plays at once.
        type: number
        default: 2
      max_match_minutes:
        description: The wall clock cap on play alone. The job timeout is this plus half an hour.
        type: number
        default: 150
      startup_ms:
        description: How long fastchess waits for an engine to answer uci.
        type: number
        default: 20000
      artifact_prefix:
        description: What the per-shard artifacts are named. The run and the attempt are added.
        type: string
        default: strength
      retention_days:
        description: How long the games are kept. Ninety is the maximum a public repository allows.
        type: number
        default: 90
    outputs:
      line:
        description: The one line a release note carries. Empty when there was nothing to compare against.
        value: ${{ jobs.summarise.outputs.line }}
      baseline_sha:
        description: The commit the baseline resolved to. Empty means the match was skipped.
        value: ${{ jobs.resolve.outputs.baseline_sha }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      baseline_name: ${{ steps.baseline.outputs.name }}
      baseline_sha: ${{ steps.baseline.outputs.sha }}
      candidate_name: ${{ steps.candidate.outputs.name }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      pairs: ${{ steps.plan.outputs.pairs }}
      book: ${{ steps.plan.outputs.book }}
      play_timeout: ${{ steps.plan.outputs.play_timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tags are what the default baseline looks through
          fetch-depth: 0
          persist-credentials: false

      - uses: aywrite/mache/actions/resolve-ref@v0.2.0
        id: candidate
        with:
          ref: ${{ inputs.candidate }}
          label: candidate
          when_empty: head

      - uses: aywrite/mache/actions/resolve-ref@v0.2.0
        id: baseline
        with:
          ref: ${{ inputs.baseline }}
          label: baseline
          when_empty: last-release
          release_glob: ${{ inputs.release_glob }}

      - name: Say so when there is nothing to compare against
        if: steps.baseline.outputs.sha == ''
        run: echo "::notice::No previous release to compare against, skipping"

      - uses: aywrite/mache/actions/plan-shards@v0.2.0
        id: plan
        with:
          games: ${{ inputs.games }}
          shards: ${{ inputs.shards }}
          sprt: ${{ inputs.sprt }}
          elo0: ${{ inputs.elo0 }}
          elo1: ${{ inputs.elo1 }}
          prior_pairs: ${{ inputs.prior_pairs }}
          book: ${{ inputs.book }}
          book_table: ${{ inputs.book_table }}
          max_match_minutes: ${{ inputs.max_match_minutes }}

  play:
    needs: resolve
    if: needs.resolve.outputs.baseline_sha != ''
    runs-on: ubuntu-latest
    strategy:
      # a shard that fell over is a smaller sample, not a lost run
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.resolve.outputs.shards) }}
    timeout-minutes: ${{ fromJSON(needs.resolve.outputs.play_timeout) }}
    defaults:
      run:
        shell: bash
    env:
      SEED: ${{ inputs.seed || github.run_id }}
      CANDIDATE: ${{ needs.resolve.outputs.candidate_name }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
      BASELINE: ${{ needs.resolve.outputs.baseline_name }}
      BASELINE_SHA: ${{ needs.resolve.outputs.baseline_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: aywrite/mache/actions/setup@v0.2.0
        id: tools
        with:
          book_table: ${{ inputs.book_table }}

      # Generic, because a reusable workflow cannot be handed a cache action.
      # A caller that wants one that understands its toolchain calls the six
      # actions and keeps its own step.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.cache_paths != ''
        with:
          path: ${{ inputs.cache_paths }}
          key: ${{ inputs.cache_key }}

      - name: Build both versions
        env:
          BUILD: ${{ inputs.build }}
        run: |
          # a pull request head is not fetched by default, and the resolve
          # job's fetch was on another machine
          for sha in "$CANDIDATE_SHA" "$BASELINE_SHA"; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null \
              || git fetch -q origin "$sha" \
              || git fetch -q origin "+refs/pull/*/head:refs/remotes/pull/*"
          done
          "$BUILD" "$CANDIDATE_SHA" tools/new
          "$BUILD" "$BASELINE_SHA" tools/old
          for binary in tools/new tools/old; do
            [ -x "$binary" ] \
              || { echo "::error::${BUILD} left no runnable ${binary}"; exit 1; }
          done

      - uses: aywrite/mache/actions/play-shard@v0.2.0
        id: play
        with:
          candidate: ${{ needs.resolve.outputs.candidate_name }}
          candidate_binary: ./new
          opponent: ${{ needs.resolve.outputs.baseline_name }}
          opponent_binary: ./old
          book: ${{ needs.resolve.outputs.book }}
          book_table: ${{ inputs.book_table }}
          pairs: ${{ needs.resolve.outputs.pairs }}
          shards: ${{ needs.resolve.outputs.count }}
          shard: ${{ matrix.shard }}
          seed: ${{ inputs.seed || github.run_id }}
          time_control: ${{ inputs.time_control }}
          hash_mb: ${{ inputs.hash_mb }}
          concurrency: ${{ inputs.concurrency }}
          startup_ms: ${{ inputs.startup_ms }}
          max_match_minutes: ${{ inputs.max_match_minutes }}

      # What it would take to play this shard again, written whether or not it
      # finished. A caller keeping its own record of its own runs writes this
      # itself and calls the actions; this is the shape for everyone else.
      - name: Write the manifest
        if: always()
        env:
          FASTCHESS: ${{ steps.tools.outputs.fastchess }}
          MACHE: ${{ steps.tools.outputs.version }}
          BOOK: ${{ needs.resolve.outputs.book }}
          BOOK_TABLE: ${{ inputs.book_table }}
          PAIRS: ${{ needs.resolve.outputs.pairs }}
          SHARD: ${{ matrix.shard }}
          TIME_CONTROL: ${{ inputs.time_control }}
          HASH: ${{ inputs.hash_mb }}
          CONCURRENCY: ${{ inputs.concurrency }}
          STARTUP_MS: ${{ inputs.startup_ms }}
          MAX_MATCH_MINUTES: ${{ inputs.max_match_minutes }}
          SPRT: ${{ inputs.sprt }}
          ELO0: ${{ inputs.elo0 }}
          ELO1: ${{ inputs.elo1 }}
          PRIOR_PAIRS: ${{ inputs.prior_pairs }}
          BUILD: ${{ inputs.build }}
          MANIFEST_EXTRA: ${{ inputs.manifest_extra }}
        run: |
          # asked for again, since the play action may not have got that far
          book_file=$("$BOOK_TABLE" file "$BOOK") || book_file=unknown
          book_sha=$(sha256sum "tools/${book_file}" | cut -d' ' -f1) || book_sha=unknown
          {
            echo "candidate: ${CANDIDATE}"
            echo "candidate_sha: ${CANDIDATE_SHA}"
            echo "baseline: ${BASELINE}"
            echo "baseline_sha: ${BASELINE_SHA}"
            echo "build: ${BUILD}"
            echo "fastchess: ${FASTCHESS}"
            # the tooling that read the games, so a figure can be read back
            # against the version that produced it
            echo "mache: ${MACHE}"
            echo "book: ${book_file}"
            echo "book_sha256: ${book_sha}"
            echo "book_openings: ${OPENINGS:-not counted, the shard did not get that far}"
            echo "seed: ${SEED}"
            echo "shard: ${SHARD}"
            echo "start: ${START:-not chosen, the shard did not get that far}"
            echo "pairs: ${PAIRS}"
            echo "time_control: ${TIME_CONTROL}"
            echo "hash_mb: ${HASH}"
            echo "concurrency: ${CONCURRENCY}"
            echo "startup_ms: ${STARTUP_MS}"
            echo "games_asked: $((PAIRS * 2))"
            if [ "$SPRT" = "true" ]; then
              echo "sprt: judged by the summary over the pooled pairs, not by fastchess: elo0=${ELO0} elo1=${ELO1} alpha=0.05 beta=0.05 model=logistic prior_pairs=${PRIOR_PAIRS:-none}"
            else
              echo "sprt: off"
            fi
            echo "wall_clock_cap_minutes: ${MAX_MATCH_MINUTES}"
            # unset when the play action never reached its end
            echo "stopped_by: ${STOPPED_BY:-not recorded, the shard did not finish}"
            echo "runner: $(uname -a)"
            echo "cores: $(nproc)"
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "run_url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -n "$MANIFEST_EXTRA" ]; then
              echo "$MANIFEST_EXTRA"
            fi
          } > tools/manifest.txt
          cat tools/manifest.txt

      # The attempt is in the name because an artifact cannot be uploaded twice
      # under one name and a rerun keeps the run id.
      - name: Keep the games
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            tools/games.pgn
            tools/result.txt
            tools/config.json
            tools/manifest.txt
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}

  summarise:
    needs: [resolve, play]
    # runs on whatever arrived, as long as there was a baseline to play
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.baseline_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    outputs:
      line: ${{ steps.summary.outputs.line }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # no harness to build and no book to fetch: this job only reads games
      - uses: aywrite/mache/actions/setup@v0.2.0
        with:
          estimator_only: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-shard-*
          path: shards

      - uses: aywrite/mache/actions/summarise-match@v0.2.0
        id: summary
        with:
          games: shards
          candidate: ${{ needs.resolve.outputs.candidate_name }}
          candidate_sha: ${{ needs.resolve.outputs.candidate_sha }}
          baseline: ${{ needs.resolve.outputs.baseline_name }}
          baseline_sha: ${{ needs.resolve.outputs.baseline_sha }}
          shards: ${{ needs.resolve.outputs.count }}
          time_control: ${{ inputs.time_control }}
          sprt: ${{ inputs.sprt }}
          elo0: ${{ inputs.elo0 }}
          elo1: ${{ inputs.elo1 }}
          prior_pairs: ${{ inputs.prior_pairs }}
          provenance: >-
            The games, the results and a manifest of what each shard played are
            kept as the
            `${{ inputs.artifact_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}-shard-<i>`
            artifacts. The openings came from seed
            ${{ inputs.seed || github.run_id }}, which replays this schedule.
