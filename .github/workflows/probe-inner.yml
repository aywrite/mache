name: Probe inner

# Throwaway, and deleted with the branch. Lists what a reusable workflow is
# told about itself, so the question of whether it can name its own commit is
# answered by a listing rather than by a guess at a property name.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  called_deeper:
    runs-on: ubuntu-latest
    steps:
      - name: Every property of the github context, two levels down
        env:
          CONTEXT: ${{ toJSON(github) }}
        run: |
          echo "--- keys ---"
          printf '%s' "$CONTEXT" | jq -r 'keys[]'
          echo "--- anything that looks like a sha or a ref ---"
          printf '%s' "$CONTEXT" | jq -r \
            'to_entries[] | select(.key | test("sha|ref|workflow")) | "\(.key) = \(.value)"'
          echo "--- the runner's own variables ---"
          env | grep '^GITHUB_' | grep -iv token | sed 's/=.*/=/' | sort

