name: Tests

# The tools parse other programs' output (a fastchess pgn, its result block),
# so they rot silently when a format shifts. These tests pin the shapes they
# read and the figures they print, which is what stands between an upstream
# change and a number nobody questions.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# a new push to a pull request makes the run in progress redundant
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # the floor requires-python declares, and the version the runners carry.
        # The floor is the leg worth having: nothing checked it before, and the
        # annotations that set it are easy to raise by accident.
        python: [ "3.10", "3.12" ]
    steps:
      # The checkout leaves the token it used in .git/config unless it is told
      # not to. Nothing in this workflow pushes, so nothing wants it there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tags and the commits the reusable workflows pin their actions
          # at. Those tests read the pinned action out of git rather than off
          # disk, since what a caller runs is that ref's action and not this
          # checkout's, and a shallow clone has neither
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: |
          python -m pip install --quiet -e '.[test]'
          python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run the hooks
        run: |
          python -m pip install --quiet --require-hashes -r .github/requirements/lint.txt
          pre-commit run --all-files --show-diff-on-failure
