# The documentation site. GitHub Pages builds it from this directory on main:
# Settings, Pages, deploy from a branch, main and /docs. There is no workflow
# and nothing to pin but the theme below.
title: mache
description: Chess engine testing on GitHub Actions, with no server to run.
url: https://aywrite.github.io
baseurl: /mache

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-titles-from-headings

aux_links:
  mache on GitHub: https://github.com/aywrite/mache
search_enabled: true
# the pages are served once, at their own address, and not also as markdown
optional_front_matter:
  remove_originals: true
heading_anchors: true

# Where each page is published and where it sits in the menu. Kept here rather
# than as front matter, which GitHub would show as a table at the top of each
# page when the files are read in the repository. A page's title is its first
# heading, except the home page's.
defaults:
  - scope: {path: ""}
    values: {layout: default}
  - scope: {path: index.md}
    values: {title: Home, nav_order: 1}
  - scope: {path: QUICKSTART.md}
    values: {permalink: /quickstart/, nav_order: 2}
  - scope: {path: tools.md}
    values: {permalink: /tools/, nav_order: 3}
  - scope: {path: without-ci.md}
    values: {permalink: /without-ci/, nav_order: 4}
  - scope: {path: limits.md}
    values: {permalink: /limits/, nav_order: 5}
  - scope: {path: how-it-works.md}
    values: {permalink: /how-it-works/, nav_order: 6}
  - scope: {path: statistics.md}
    values: {permalink: /statistics/, nav_order: 7}
  - scope: {path: BUILDING-A-REF.md}
    values: {permalink: /building-a-ref/, nav_order: 8}
